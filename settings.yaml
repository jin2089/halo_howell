apiVersion: v1alpha1
kind: Setting
metadata:
  name: halo_howell-setting
spec:
  forms:
    - group: layout
      label: 布局
      formSchema:
        - $formkit: select
          name: site_title_size
          label: 站点标题字号
          value: small
          options:
            - label: 小
              value: small
            - label: 中
              value: medium
            - label: 大
              value: large
        - $formkit: select
          name: post_list_layout
          label: 文章列表布局
          value: single
          options:
            - label: 单条
              value: single
            - label: 网格（一行两列）
              value: grid_2
            - label: 网格（一行三列）
              value: grid_3
          help: "选择单条时，文章卡片的图片将位于左侧"
        - $formkit: checkbox
          name: minimal_layout
          label: 极简布局
          value: true
          help: "默认开启：首页和列表页强制单条，文章页去卡片化，页脚使用自定义内容。关闭后恢复文章列表布局与页脚风格选项。"
        - $formkit: group
          name: post_card_display
          id: post_card_display
          label: 文章卡片显示设置
          help: 勾选需要在首页、分类、标签和作者页文章卡片中显示的信息。
          value:
            categories: true
            tags: true
            excerpt: true
            publish_time: true
            pin: true
          attrs:
            style: "display:flex;flex-wrap:wrap;gap:8px 16px;"
          children:
            - $formkit: checkbox
              name: categories
              label: 分类
              value: true
            - $formkit: checkbox
              name: tags
              label: 标签
              value: true
            - $formkit: checkbox
              name: excerpt
              label: 摘要
              value: true
            - $formkit: checkbox
              name: publish_time
              label: 发布时间
              value: true
            - $formkit: checkbox
              name: pin
              label: 置顶图标
              value: true
        - $formkit: checkbox
          name: show_reading_progress
          label: 显示阅读进度条
          value: true
          help: 在导航栏下方显示当前页面的阅读进度。
        - $formkit: checkbox
          name: enable_glass_navbar
          id: enable_glass_navbar
          label: 毛玻璃导航栏
          value: false
        - $formkit: number
          if: "$get(enable_glass_navbar).value"
          name: glass_navbar_opacity
          label: 毛玻璃不透明度
          value: "0.82"
          min: "0.82"
          max: "1"
          step: "0.01"
          help: 数值越低越透明；为保障导航文字对比度，最低为 0.82。
        - $formkit: number
          if: "$get(enable_glass_navbar).value"
          name: glass_navbar_blur
          label: 毛玻璃模糊强度
          value: "0.75"
          min: "0"
          max: "1"
          step: "0.01"
          help: 0 到 1，数值越大背景越模糊。

    - group: global
      label: 全局
      formSchema:
        - $formkit: select
          name: logo_type
          id: logo_type
          label: 菜单栏 Logo 类型
          value: image
          options:
            - label: 文字
              value: text
            - label: 图片
              value: image
        - $formkit: checkbox
          name: show_scroll_button
          label: 显示滚动到顶部按钮
          value: true

    - group: style
      label: 样式
      formSchema:
        - $formkit: select
          name: color_scheme
          label: 默认配色
          value: system
          options:
            - label: 跟随系统
              value: system
            - label: 深色
              value: dark
            - label: 浅色
              value: light

        - $formkit: checkbox
          name: enable_change_color_scheme
          label: 允许访客切换配色
          value: true

        - $formkit: checkbox
          name: enable_color_scheme_animation
          label: 切换配色动画
          value: false
          help: 开启后切换配色时显示从点击位置扩散的圆形动画；系统开启「减少动态效果」时自动禁用。

        - $formkit: select
          name: accent_hue
          label: 默认主题色相
          help: 色相取值为 0-360，同时影响中性色与品牌色的色调
          value: "250"
          options:
            - label: 蓝色
              value: "250"
            - label: 青色
              value: "195"
            - label: 绿色
              value: "150"
            - label: 琥珀
              value: "60"
            - label: 紫色
              value: "300"

        - $formkit: checkbox
          name: enable_change_hue
          label: 允许访客切换主题色相
          value: true

        - $formkit: select
          name: font_family
          label: 字体
          value: system
          options:
            - label: 系统默认
              value: system
            - label: Noto Sans SC 思源黑体简体
              value: noto_sans_sc
            - label: Noto Serif SC 思源宋体
              value: noto_serif_sc
            - label: 落霞孤鹜文楷
              value: lxgw_wenkai

        - $formkit: select
          name: style_preset
          label: 主题样式预设
          value: plain
          help: 预设只调整中性色相，品牌色仍由「主题色相」控制。
          options:
            - label: 素笺（默认）
              value: plain
            - label: 晴空
              value: azure
            - label: 青墨
              value: indigo
            - label: 竹青
              value: bamboo
            - label: 翠微
              value: jade
            - label: 松烟
              value: pine
            - label: 鹅黄
              value: gosling
            - label: 橘颂
              value: tangerine
            - label: 旧笺
              value: vintage
            - label: 桃夭
              value: peach
            - label: 胭脂
              value: rouge
            - label: 紫烟
              value: violet

    - group: post
      label: 文章
      formSchema:
        - $formkit: select
          name: content_style
          label: 内容样式
          value: "github"
          options:
            - label: GitHub 风格
              value: github
            - label: Tailwind CSS Typography
              value: tailwind
        - $formkit: select
          name: title_position
          label: 标题位置
          value: "content"
          options:
            - value: "content"
              label: "正文中"
            - value: "cover"
              label: "封面中"
        - $formkit: text
          name: cover_height
          label: 封面图高度
          value: "24rem"
        - $formkit: select
          name: toc_mode
          label: 文章目录显示
          value: both
          options:
            - label: 关闭
              value: none
            - label: 左侧粘性目录
              value: left
            - label: 文内目录
              value: inline
            - label: 左侧 + 移动端文内
              value: both
        - $formkit: select
          name: navigation_scope
          label: 上一篇/下一篇范围
          value: all
          options:
            - label: 全站文章
              value: all
            - label: 同主分类
              value: category
          help: 「同主分类」需要 Halo 2.25.0 及以上版本；旧版本会自动退回全站文章。
        - $formkit: group
          name: post_display
          id: post_display
          label: 文章页显示设置
          help: 勾选需要在文章页中显示的信息与操作。
          value:
            categories: true
            tags: true
            visit: true
            publish_time: true
            navigation: true
            upvote: true
            share: true
          attrs:
            style: "display:flex;flex-wrap:wrap;gap:8px 16px;"
          children:
            - $formkit: checkbox
              name: categories
              label: 分类
              value: true
            - $formkit: checkbox
              name: tags
              label: 标签
              value: true
            - $formkit: checkbox
              name: visit
              label: 浏览量
              value: true
            - $formkit: checkbox
              name: publish_time
              label: 发布时间
              value: true
            - $formkit: checkbox
              name: navigation
              label: 上一篇/下一篇
              value: true
            - $formkit: checkbox
              name: upvote
              label: 点赞按钮
              value: true
            - $formkit: checkbox
              name: share
              label: 分享按钮
              value: true
        - $formkit: checkbox
          name: expand_inline_toc
          label: 展开文内目录
          value: false
        - $formkit: checkbox
          if: "$get(post_display).value == null"
          name: show_upvote_button
          label: 显示点赞按钮（旧配置）
          help: 已废弃，请使用「文章页显示设置」中的点赞选项。
          value: true
        - $formkit: checkbox
          if: "$get(post_display).value == null"
          name: show_share_button
          id: show_share_button
          label: 显示分享按钮（旧配置）
          help: 已废弃，请使用「文章页显示设置」中的分享选项。
          value: true
        - $formkit: select
          if: "$get(post_display).value.share"
          name: share_item_ids
          key: share_item_ids
          id: share_item_ids
          multiple: true
          sortable: true
          label: 分享平台
          value:
            - wechat
            - x
            - telegram
            - facebook
            - qq
            - qzone
            - weibo
            - douban
            - native
          options:
            - label: 微信
              value: wechat
            - label: X
              value: x
            - label: Telegram
              value: telegram
            - label: Facebook
              value: facebook
            - label: QQ
              value: qq
            - label: QQ 空间
              value: qzone
            - label: 微博
              value: weibo
            - label: 豆瓣
              value: douban
            - label: 系统分享
              value: native
    - group: sidebar
      label: 侧边栏
      formSchema:
        - $formkit: checkbox
          name: show_on_page
          label: 页面显示侧边栏
          value: false
          help: 开启后，独立页面会显示侧边栏；关闭时正文居中显示。
        - $formkit: array
          name: widgets
          label: 小部件
          value:
            - value: popular-posts
            - value: categories
            - value: tags
          itemLabels:
            - type: "text"
              label: "$value.value"
          children:
            - $formkit: select
              name: value
              id: value
              key: value
              label: 部件
              options:
                - label: 站点资料
                  value: profile
                - label: 热门文章
                  value: popular-posts
                - label: 文章分类
                  value: categories
                - label: 文章标签
                  value: tags
            - $formkit: group
              if: "$value.value === profile"
              name: options
              key: profile-options
              id: profile-options
              label: 站点资料选项
              children:
                - $formkit: attachment
                  name: logo
                  label: 站点资料 Logo
                - $formkit: array
                  name: social_media
                  label: 社交媒体
                  value: []
                  itemLabels:
                    - type: "iconify"
                      label: "$value.icon"
                    - type: "text"
                      label: "$value.name"
                    - type: "text"
                      label: "$value.url"
                  children:
                    - $formkit: iconify
                      format: svg
                      name: icon
                      label: 图标
                      validation: "required"
                    - $formkit: text
                      name: name
                      label: 名称
                    - $formkit: text
                      name: url
                      label: 链接
                      validation: "required"
                    - $formkit: select
                      name: url_type
                      label: 链接类型
                      value: normal
                      help: "如果选择了图片类型，那么在访客点击之后会使用弹框的形式加载"
                      options:
                        - label: 跳转链接
                          value: normal
                        - label: 图片
                          value: image

            - $formkit: group
              if: "$value.value === 'tags'"
              name: options
              key: tags-options
              id: tags-options
              label: 标签选项
              children:
                - $formkit: checkbox
                  name: show_unused_tags
                  label: 显示零使用的标签
                  value: false
                  help: 关闭后，未被使用过的标签不会出现在侧边栏标签小部件中。

        - $formkit: group
          name: profile
          help: 已废弃，将在未来的版本移除，请使用上方的站点资料小部件中的配置代替
          value:
            logo:
          children:
            - $formkit: attachment
              name: logo
              label: 站点资料 Logo

        - $formkit: array
          name: social_media
          label: 社交媒体
          value: []
          help: 已废弃，将在未来的版本移除，请使用上方的站点资料小部件中的配置代替
          itemLabels:
            - type: "text"
              label: "$value.name"
            - type: "text"
              label: "$value.url"
          children:
            - $formkit: select
              name: icon
              label: 图标
              options:
                - label: 电子邮箱
                  value: i-tabler-mail
                - label: 微信
                  value: i-simple-icons-wechat
                - label: 腾讯 QQ
                  value: i-simple-icons-tencentqq
                - label: 新浪微博
                  value: i-simple-icons-sinaweibo
                - label: 知乎
                  value: i-simple-icons-zhihu
                - label: 豆瓣
                  value: i-simple-icons-douban
                - label: 哔哩哔哩
                  value: i-simple-icons-bilibili
                - label: 抖音 / TikTok
                  value: i-simple-icons-tiktok
                - label: Telegram
                  value: i-simple-icons-telegram
                - label: Facebook
                  value: i-simple-icons-facebook
                - label: Instagram
                  value: i-simple-icons-instagram
                - label: LinkedIn
                  value: i-simple-icons-linkedin
                - label: Twitter
                  value: i-simple-icons-twitter
                - label: Slack
                  value: i-simple-icons-slack
                - label: Discord
                  value: i-simple-icons-discord
                - label: YouTube
                  value: i-simple-icons-youtube
                - label: Steam
                  value: i-simple-icons-steam
                - label: GitHub
                  value: i-simple-icons-github
                - label: GitLab
                  value: i-simple-icons-gitlab
                - label: RSS
                  value: i-simple-icons-rss
            - $formkit: text
              name: name
              label: 名称
            - $formkit: text
              name: url
              label: 链接
              validation: "required"
            - $formkit: select
              name: url_type
              label: 链接类型
              value: normal
              help: "如果选择了图片类型，那么在访客点击之后会使用弹框的形式加载"
              options:
                - label: 跳转链接
                  value: normal
                - label: 图片
                  value: image

    - group: footer
      label: 页脚
      formSchema:
        - $formkit: select
          name: style
          id: style
          key: style
          label: 页脚风格
          value: items
          options:
            - label: 风格一
              value: style_1
            - label: 风格二
              value: style_2
            - label: 自定义内容
              value: items

        - $formkit: attachment
          name: logo
          label: Logo
          help: 如果不设置，将使用站点设置的 Logo

        - $formkit: text
          name: title
          label: 标题
          help: 如果不设置，将使用站点设置的标题

        - $formkit: textarea
          rows: 3
          name: slogan
          id: slogan
          key: slogan
          if: "$get(style).value === style_2"
          label: 标语

        - $formkit: select
          if: "$get(style).value === style_1"
          name: right_menu
          id: right_menu
          key: right_menu
          label: 右侧菜单
          action: "/api/v1alpha1/menus"
          autoSelect: false
          clearable: true
          requestOption:
            labelField: "spec.displayName"
            valueField: "metadata.name"

        - $formkit: select
          if: "$get(style).value === style_2"
          name: menu_names
          id: menu_names
          key: menu_names
          label: 菜单组
          value: []
          multiple: true
          sortable: true
          action: "/api/v1alpha1/menus"
          requestOption:
            labelField: "spec.displayName"
            valueField: "metadata.name"

        - $formkit: array
          name: social_media
          label: 社交媒体
          value: []
          itemLabels:
            - type: "iconify"
              label: "$value.iconify"
            - type: "text"
              label: "$value.name"
            - type: "text"
              label: "$value.url"
          children:
            - $formkit: iconify
              name: iconify
              label: 图标
              format: svg
              validation: "required"
            - $formkit: text
              name: name
              label: 名称
            - $formkit: text
              name: url
              label: 链接
              validation: "required"
            - $formkit: select
              name: url_type
              label: 链接类型
              value: normal
              help: "如果选择了图片类型，那么在访客点击之后会使用弹框的形式加载"
              options:
                - label: 跳转链接
                  value: normal
                - label: 图片
                  value: image
            - $formkit: select
              name: icon
              label: 图标
              help: 已废弃，将在未来的版本移除，请使用上方的图标选择器代替
              options:
                - label: 电子邮箱（tabler:mail）
                  value: i-tabler-mail
                - label: 微信（simple-icons:wechat）
                  value: i-simple-icons-wechat
                - label: 腾讯 QQ（simple-icons:tencentqq）
                  value: i-simple-icons-tencentqq
                - label: 新浪微博（simple-icons:sinaweibo）
                  value: i-simple-icons-sinaweibo
                - label: 知乎（simple-icons:zhihu）
                  value: i-simple-icons-zhihu
                - label: 豆瓣（simple-icons:douban）
                  value: i-simple-icons-douban
                - label: 哔哩哔哩（simple-icons:bilibili）
                  value: i-simple-icons-bilibili
                - label: 抖音 / TikTok（simple-icons:tiktok）
                  value: i-simple-icons-tiktok
                - label: Telegram（simple-icons:telegram）
                  value: i-simple-icons-telegram
                - label: Facebook（simple-icons:facebook）
                  value: i-simple-icons-facebook
                - label: Instagram（simple-icons:instagram）
                  value: i-simple-icons-instagram
                - label: LinkedIn（simple-icons:linkedin）
                  value: i-simple-icons-linkedin
                - label: Twitter（simple-icons:twitter）
                  value: i-simple-icons-twitter
                - label: Slack（simple-icons:slack）
                  value: i-simple-icons-slack
                - label: Discord（simple-icons:discord）
                  value: i-simple-icons-discord
                - label: YouTube（simple-icons:youtube）
                  value: i-simple-icons-youtube
                - label: Steam（simple-icons:steam）
                  value: i-simple-icons-steam
                - label: GitHub（simple-icons:github）
                  value: i-simple-icons-github
                - label: GitLab（simple-icons:gitlab）
                  value: i-simple-icons-gitlab
                - label: RSS（simple-icons:rss）
                  value: i-simple-icons-rss
        - $formkit: array
          if: "$get(style).value === 'items'"
          name: footer_items
          label: 页脚内容
          help: 仅在「自定义内容」风格下生效，可按需增删和排序。
          value:
            - value: social_media
            - value: copyright
            - value: powered_by
            - value: halo_footer
          itemLabels:
            - type: "text"
              label: "$value.value"
          children:
            - $formkit: select
              name: value
              key: footer_item_value
              label: 内容
              options:
                - label: 版权信息
                  value: copyright
                - label: 架构信息
                  value: powered_by
                - label: Halo 页脚扩展
                  value: halo_footer
                - label: ICP 备案
                  value: icp
                - label: 公安联网备案
                  value: gongan
                - label: 社交媒体
                  value: social_media
            - $formkit: group
              if: "$value.value === 'icp'"
              name: options
              key: icp-options
              label: ICP 备案设置
              children:
                - $formkit: text
                  name: text
                  label: ICP 备案号
            - $formkit: group
              if: "$value.value === 'gongan'"
              name: options
              key: gongan-options
              label: 公安联网备案设置
              children:
                - $formkit: text
                  name: text
                  label: 公安联网备案号
            - $formkit: group
              if: "$value.value === 'social_media'"
              name: options
              key: social-options
              label: 社交媒体
              children:
                - $formkit: array
                  name: items
                  label: 链接
                  value: []
                  itemLabels:
                    - type: "iconify"
                      label: "$value.iconify"
                    - type: "text"
                      label: "$value.name"
                    - type: "text"
                      label: "$value.url"
                  children:
                    - $formkit: iconify
                      name: iconify
                      label: 图标
                      format: svg
                      validation: "required"
                    - $formkit: text
                      name: name
                      label: 名称
                    - $formkit: text
                      name: url
                      label: 链接
                      validation: "required"
                    - $formkit: select
                      name: url_type
                      label: 链接类型
                      value: normal
                      help: "如果选择了图片类型，那么在访客点击之后会使用弹框的形式加载"
                      options:
                        - label: 跳转链接
                          value: normal
                        - label: 图片
                          value: image
        - $formkit: code
          label: 自定义版权信息
          name: custom_copyright
          language: html
          help: "如果不设置，将使用默认的版权信息，支持 HTML 代码"
    - group: seo
      label: SEO
      formSchema:
        - $formkit: checkbox
          name: enable_og
          label: Open Graph 标签
          value: false
          help: 启用后输出 og:title / og:description / og:image / og:url 等标签。如果已安装「SEO 工具集」插件，建议关闭以避免重复。
        - $formkit: checkbox
          name: enable_twitter_card
          label: Twitter Card 标签
          value: false
          help: 启用后输出 twitter:card / twitter:title / twitter:description / twitter:image 标签。
        - $formkit: checkbox
          name: enable_canonical
          label: Canonical URL
          value: false
          help: 启用后输出 link rel="canonical" 标签，帮助搜索引擎识别规范链接。
        - $formkit: checkbox
          name: enable_json_ld
          label: JSON-LD 结构化数据
          value: false
