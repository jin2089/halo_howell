<include src="layout.html">
  <template name="head">
    <title th:text="|${post.spec.title} - ${site.title}|"></title>
    <script type="module" src="./assets/post.ts"></script>
  </template>
  <section
    class="mx-auto mt-6 grid max-w-7xl grid-cols-1 gap-6 px-4 md:grid-cols-[minmax(0,1fr)_18rem] lg:px-6"
    th:with="tocMode = ${theme.config.post.toc_mode ?: 'both'}, postDisplay = ${theme.config.post.post_display}, titleOnCover = ${(theme.config.post.title_position ?: 'content') == 'cover' and not #strings.isEmpty(post.spec.cover)}"
    th:classappend="${tocMode == 'left' or tocMode == 'both' ? 'xl:grid-cols-[14rem_minmax(0,1fr)_18rem]' : 'xl:grid-cols-[minmax(0,1fr)_18rem]'}"
  >
    <div
      th:if="${tocMode == 'left' or tocMode == 'both'}"
      class="toc-container hidden xl:col-start-1 xl:block xl:w-56 xl:shrink-0 xl:pt-8"
    >
      <div
        class="bg-surface-card sticky top-24 rounded-xl border border-gray-200/80 p-4 shadow-sm transition-all duration-300 dark:border-slate-700"
      >
        <h2 class="inline-flex items-center gap-2 text-base font-semibold text-gray-900 dark:text-slate-50">
          <span class="i-tabler-list-tree text-primary-500 text-lg"></span>
          <th:block th:text="#{page.post.toc}"></th:block>
        </h2>
        <div class="toc mt-2 max-h-[calc(100vh-8rem)] overflow-auto"></div>
      </div>
    </div>
    <div class="z-0 min-w-0" th:classappend="${(tocMode == 'left' or tocMode == 'both') ? ' xl:col-start-2' : ''}">
      <div
        th:attr="data-post-name=${post.metadata.name},data-share-ids=${theme.config.post.share_item_ids != null ? #strings.listJoin(theme.config.post.share_item_ids, ',') : ''}"
        x-data="Object.assign(upvote('post','content.halo.run','posts'), share($el.dataset.shareIds ? $el.dataset.shareIds.split(',') : []), { name: $el.dataset.postName })"
        class="post-detail animated fadeIn min-w-0 pt-2 lg:pt-8"
      >
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h1
            th:unless="${titleOnCover}"
            class="vt-post-title text-3xl font-bold break-all text-gray-900 dark:text-slate-50"
            th:text="${post.spec.title}"
          ></h1>
          <div
            sec:authorize="isAuthenticated()"
            th:attr="x-data=|uiPermission('${#authentication.name}','system:posts:manage')|"
            class="ml-auto flex items-center"
            id="edit-button"
          >
            <template x-if="shouldDisplay">
              <a
                th:href="|/console/posts/editor?name=${post.metadata.name}&returnToView=true|"
                th:aria-label="#{common.edit}"
                th:title="#{common.edit}"
                class="inline-flex size-9 items-center justify-center rounded-full text-gray-500 transition-all hover:bg-gray-100 hover:text-gray-900 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-slate-100"
              >
                <span class="i-tabler-edit text-xl"></span>
              </a>
            </template>
          </div>
        </div>

        <div
          class="my-4 flex flex-wrap items-center justify-between gap-4 text-sm text-gray-500 lg:my-8 dark:text-slate-400"
        >
          <div class="flex flex-wrap items-center gap-4">
            <div
              th:if="${(postDisplay?.categories ?: true) and not #lists.isEmpty(post.categories)}"
              class="inline-flex flex-wrap items-center gap-1.5"
            >
              <span class="i-tabler-folder text-sm" aria-hidden="true"></span>
              <a
                th:each="category : ${post.categories}"
                th:href="@{${category.status.permalink}}"
                th:title="${category.spec.displayName}"
                th:text="${category.spec.displayName}"
                class="text-sm font-light transition-colors hover:text-gray-900 dark:hover:text-slate-50"
              ></a>
            </div>
            <span th:if="${postDisplay?.visit ?: true}" class="inline-flex items-center gap-1.5">
              <span class="i-tabler-eye text-sm" aria-hidden="true"></span>
              <span th:text="${post.stats?.visit ?: 0}"></span>
            </span>
          </div>
          <span
            th:if="${postDisplay?.publish_time ?: true}"
            class="tabular-nums"
            th:title="${#dates.format(post.spec.publishTime,'yyyy-MM-dd')}"
            th:text="${#dates.format(post.spec.publishTime,'yyyy-MM-dd')}"
          ></span>
        </div>

        <div
          th:if="${not #strings.isEmpty(post.spec.cover)}"
          class="post-feature-image relative mx-auto my-6 w-full overflow-hidden rounded-xl border border-gray-200/80 shadow-sm dark:border-slate-700"
          th:style="|--cover-height: ${theme.config.post.cover_height ?: '24rem'};|"
          th:classappend="${titleOnCover ? ' h-[var(--cover-height)]' : ''}"
        >
          <img
            class="w-full"
            th:classappend="${titleOnCover ? ' h-full object-cover' : ''}"
            th:src="${post.spec.cover}"
            th:alt="${post.spec.title}"
            th:srcset="|${thumbnail.gen(post.spec.cover, 's')} 400w, ${thumbnail.gen(post.spec.cover, 'm')} 800w, ${thumbnail.gen(post.spec.cover, 'l')} 1200w, ${thumbnail.gen(post.spec.cover, 'xl')} 1600w|"
            sizes="(max-width: 1600px) 100vw, 1600px"
            decoding="async"
          />
          <div
            th:if="${titleOnCover}"
            class="absolute inset-0 flex items-end bg-linear-to-t from-black/70 via-black/20 to-transparent p-5 sm:p-8"
          >
            <h1
              class="vt-post-title text-3xl font-bold break-all text-white drop-shadow sm:text-4xl"
              th:text="${post.spec.title}"
            ></h1>
          </div>
        </div>
        <div
          th:if="${tocMode == 'inline' or tocMode == 'both'}"
          class="toc-container bg-surface-card my-5 rounded-xl p-4 shadow-sm"
          th:classappend="${tocMode == 'both' ? ' xl:hidden' : ''}"
          th:attr="x-data=|{ tocOpen: ${theme.config.post.expand_inline_toc ?: false} }|"
        >
          <button
            type="button"
            class="flex w-full items-center justify-between gap-3 text-left"
            @click="tocOpen = !tocOpen"
            :aria-expanded="tocOpen.toString()"
          >
            <span class="inline-flex items-center gap-2 text-base font-medium text-gray-900 dark:text-slate-50">
              <span class="i-tabler-list-tree text-primary-500 text-lg"></span>
              <span th:text="#{page.post.toc}"></span>
            </span>
            <span
              class="i-tabler-chevron-down text-lg text-gray-400 transition-transform dark:text-slate-500"
              :class="tocOpen ? 'rotate-180' : ''"
            ></span>
          </button>
          <div class="toc mt-3 max-h-64 overflow-auto" x-show="tocOpen" x-cloak></div>
        </div>
        <image-gallery
          data-gallery-content
          th:attr="data-dialog-label=#{fragment.gallery.title},data-close-label=#{fragment.lightbox.close},data-previous-label=#{fragment.gallery.previous},data-next-label=#{fragment.gallery.next},data-detail-label=#{fragment.gallery.detail}"
        >
          <article
            id="content"
            class="!max-w-none break-words"
            th:classappend="${theme.config.post.content_style == 'github' ? 'markdown-body' : 'tailwind-typography'}"
            th:utext="${post.content.content}"
          ></article>
        </image-gallery>

        <div
          th:if="${(postDisplay?.tags ?: true) and not #lists.isEmpty(post.tags)}"
          class="mt-6 flex flex-wrap items-center gap-2"
        >
          <span class="i-tabler-hash text-sm text-gray-400 dark:text-slate-500" aria-hidden="true"></span>
          <a
            th:each="tag : ${post.tags}"
            th:href="@{${tag.status.permalink}}"
            th:title="${tag.spec.displayName}"
            class="bg-primary-soft text-primary inline-flex items-center gap-x-1.5 rounded-full px-2.5 py-1 text-xs font-medium transition-all hover:opacity-80 dark:hover:opacity-90"
          >
            <span th:text="|#${tag.spec.displayName}|"></span>
            <sup th:text="${tag.postCount ?: 0}"></sup>
          </a>
        </div>

        <div
          th:if="${(postDisplay?.upvote ?: (theme.config.post.show_upvote_button ?: true)) or haloCommentEnabled or (postDisplay?.share ?: (theme.config.post.show_share_button ?: true))}"
          class="sticky bottom-10 z-30 mt-8 flex justify-center"
        >
          <ul
            class="bg-surface-card flex h-12 items-center gap-2 rounded-full border border-gray-200 px-2 py-1.5 shadow-lg dark:border-slate-700"
          >
            <li
              th:if="${postDisplay?.upvote ?: (theme.config.post.show_upvote_button ?: true)}"
              class="inline-flex h-full"
            >
              <button
                type="button"
                @click="handleUpvote(name)"
                :aria-pressed="upvoted(name).toString()"
                th:aria-label="#{fragment.postActions.upvote}"
                th:title="#{fragment.postActions.upvote}"
                class="group hover:text-danger-600 dark:hover:text-danger-400 inline-flex h-full cursor-pointer items-center justify-center gap-1.5 rounded-full px-2 text-gray-500 transition-all hover:bg-gray-100 dark:text-slate-400 dark:hover:bg-slate-700"
              >
                <span class="i-tabler-heart text-lg" x-show="!upvoted(name)" x-cloak aria-hidden="true"></span>
                <span
                  class="i-tabler-heart-filled text-danger-600 text-lg"
                  x-show="upvoted(name)"
                  x-cloak
                  aria-hidden="true"
                ></span>
                <span
                  class="text-sm"
                  th:attr="data-upvote-post-name=${post.metadata.name}"
                  th:text="${post.stats?.upvote ?: 0}"
                ></span>
              </button>
            </li>
            <li th:if="${haloCommentEnabled}" class="inline-flex h-full">
              <a
                href="#comment"
                th:aria-label="#{common.comment}"
                th:title="#{common.comment}"
                class="group hover:text-primary-500 dark:hover:text-primary-400 inline-flex h-full items-center gap-1.5 rounded-full px-2 text-gray-500 transition-all hover:bg-gray-100 dark:text-slate-400 dark:hover:bg-slate-700"
              >
                <span class="i-tabler-message-circle text-lg" aria-hidden="true"></span>
                <span class="text-sm" th:text="${post.stats?.comment ?: 0}"></span>
              </a>
            </li>
            <li
              th:if="${postDisplay?.share ?: (theme.config.post.show_share_button ?: true)}"
              class="inline-flex h-full"
            >
              <button
                type="button"
                @click="shareModal = true"
                th:aria-label="#{fragment.shareModal.title}"
                th:title="#{fragment.shareModal.title}"
                class="group hover:text-success-600 dark:hover:text-success-500 inline-flex h-full cursor-pointer items-center justify-center rounded-full px-2 text-gray-500 transition-all hover:bg-gray-100 dark:text-slate-400 dark:hover:bg-slate-700"
              >
                <span class="i-tabler-share text-lg" aria-hidden="true"></span>
              </button>
            </li>
          </ul>
        </div>

        <th:block th:if="${postDisplay?.share ?: (theme.config.post.show_share_button ?: true)}">
          <th:block th:replace="~{modules/share-modal}" />
        </th:block>

        <div
          class="mt-10 flex flex-col sm:flex-row sm:justify-between"
          th:if="${postDisplay?.navigation ?: true}"
          th:with="postCursor = ${(theme.config.post.navigation_scope == 'category' and #halo.matchVersion('>=2.25.0')) ? postFinder.cursorByCategory(post.metadata.name) : postFinder.cursor(post.metadata.name)}"
        >
          <div class="flex justify-start">
            <a
              th:if="${postCursor.hasPrevious()}"
              role="navigation"
              class="group inline-flex items-center gap-2 truncate text-sm text-gray-600 hover:text-gray-900 dark:text-slate-100 dark:hover:text-slate-200"
              th:href="@{${postCursor.previous.status.permalink}}"
              th:title="${postCursor.previous.spec.title}"
            >
              <span
                class="i-tabler-chevron-left translate-x-1 text-lg transition-all group-hover:-translate-x-0"
              ></span>
              <span th:text="${#strings.abbreviate(postCursor.previous.spec.title,20)}"></span>
            </a>
          </div>
          <div class="flex justify-end">
            <a
              th:if="${postCursor.hasNext()}"
              role="navigation"
              class="group inline-flex items-center gap-2 truncate text-sm text-gray-600 hover:text-gray-900 dark:text-slate-100 dark:hover:text-slate-200"
              th:href="@{${postCursor.next.status.permalink}}"
              th:title="${postCursor.next.spec.title}"
            >
              <span th:text="${#strings.abbreviate(postCursor.next.spec.title,20)}"></span>
              <span
                class="i-tabler-chevron-right -translate-x-1 text-lg transition-all group-hover:translate-x-0"
              ></span>
            </a>
          </div>
        </div>
        <hr th:if="${haloCommentEnabled}" class="my-10 dark:border-slate-700" />
        <div id="comment" th:if="${haloCommentEnabled}">
          <h2 class="mb-2 text-base font-medium text-gray-900 dark:text-slate-50" th:text="#{common.comment}"></h2>
          <halo:comment group="content.halo.run" kind="Post" th:attr="name=${post.metadata.name}" />
        </div>
      </div>
    </div>
    <div th:classappend="${(tocMode == 'left' or tocMode == 'both') ? ' xl:col-start-3' : ''}">
      <th:block th:replace="~{modules/sidebar :: sidebar(prepend = null)}" />
    </div>
  </section>
</include>
