<div
  class="bg-surface-card w-full overflow-hidden rounded-xl p-3 shadow-sm transition-all duration-500 hover:shadow-md"
  th:with="stats = ${siteStatsFinder.getStats()}, profileLogo = ${options?.logo ?: site.logo}, socialMedia = ${options?.social_media}"
>
  <div class="flex flex-col items-center text-center">
    <a href="/" class="group relative block size-24 overflow-hidden rounded-2xl">
      <img
        th:if="${not #strings.isEmpty(profileLogo)}"
        th:src="${profileLogo}"
        th:alt="${site.title}"
        width="96"
        height="96"
        loading="lazy"
        decoding="async"
        class="size-full object-cover"
      />
      <span
        th:if="${#strings.isEmpty(profileLogo)}"
        class="flex size-full items-center justify-center bg-gray-100 text-3xl font-bold text-gray-700 dark:bg-slate-700 dark:text-slate-100"
      >
        <span class="i-tabler-bolt"></span>
      </span>
    </a>

    <h1 class="mt-4 text-xl font-semibold dark:text-slate-50" th:text="${site.title}"></h1>
    <p
      th:unless="${#strings.isEmpty(site.subtitle)}"
      class="mt-2 line-clamp-3 text-center text-sm text-gray-600 dark:text-slate-300"
      th:text="${site.subtitle}"
    ></p>
  </div>

  <dl class="mt-5 grid grid-cols-2 gap-2 text-center">
    <div class="min-w-0 rounded-xl bg-gray-50 px-2 py-2 dark:bg-slate-700/60">
      <dt class="text-xs text-gray-600 dark:text-slate-300" th:text="#{widget.profile.postCount.label}"></dt>
      <dd class="mt-1 text-lg font-semibold text-gray-900 tabular-nums dark:text-slate-50">
        <number-formatter th:attr="value=${stats.post}" />
      </dd>
    </div>
    <div class="min-w-0 rounded-xl bg-gray-50 px-2 py-2 dark:bg-slate-700/60">
      <dt class="text-xs text-gray-600 dark:text-slate-300" th:text="#{widget.profile.categoryCount.label}"></dt>
      <dd class="mt-1 text-lg font-semibold text-gray-900 tabular-nums dark:text-slate-50">
        <number-formatter th:attr="value=${stats.category}" />
      </dd>
    </div>
    <div class="min-w-0 rounded-xl bg-gray-50 px-2 py-2 dark:bg-slate-700/60">
      <dt class="text-xs text-gray-600 dark:text-slate-300" th:text="#{widget.profile.commentCount.label}"></dt>
      <dd class="mt-1 text-lg font-semibold text-gray-900 tabular-nums dark:text-slate-50">
        <number-formatter th:attr="value=${stats.comment}" />
      </dd>
    </div>
    <div class="min-w-0 rounded-xl bg-gray-50 px-2 py-2 dark:bg-slate-700/60">
      <dt class="text-xs text-gray-600 dark:text-slate-300" th:text="#{widget.profile.visitCount.label}"></dt>
      <dd class="mt-1 text-lg font-semibold text-gray-900 tabular-nums dark:text-slate-50">
        <number-formatter th:attr="value=${stats.visit}" />
      </dd>
    </div>
  </dl>

  <div
    th:if="${socialMedia != null and not #lists.isEmpty(socialMedia)}"
    class="mt-4 flex flex-wrap items-center justify-center gap-2"
  >
    <th:block th:each="social_media : ${socialMedia}">
      <a
        th:if="${social_media.url_type == 'normal'}"
        th:aria-label="${social_media.name}"
        class="inline-flex cursor-pointer items-center justify-center rounded-xl p-2 text-gray-600 hover:bg-gray-100 dark:text-slate-400 dark:hover:bg-slate-700 [&>svg]:size-5"
        th:href="${social_media.url}"
        target="_blank"
        rel="noopener noreferrer"
      >
        <th:block th:utext="${social_media.icon.value}" />
      </a>

      <image-lightbox
        th:if="${social_media.url_type == 'image'}"
        th:attr="src=${social_media.url},alt=${social_media.name},data-close-label=#{fragment.lightbox.close}"
        role="button"
        tabindex="0"
        class="inline-flex cursor-pointer items-center justify-center rounded-xl p-2 text-gray-600 hover:bg-gray-100 dark:text-slate-400 dark:hover:bg-slate-700 [&>svg]:size-5"
      >
        <th:block th:utext="${social_media.icon.value}" />
      </image-lightbox>
    </th:block>
  </div>
</div>
