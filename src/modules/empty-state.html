<div
  th:fragment="empty(message, icon)"
  class="bg-surface-card mt-6 flex flex-col items-center justify-center gap-3 rounded-xl border border-dashed border-gray-200 px-6 py-12 text-center dark:border-slate-700"
>
  <span th:classappend="${icon}" class="text-4xl text-gray-300 dark:text-slate-600" aria-hidden="true"></span>
  <p class="text-sm font-light text-gray-600 dark:text-slate-300" th:text="${message}"></p>
</div>
