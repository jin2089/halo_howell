<!--
  页面无关的 head 资源：配色 meta、字体、i18n 文案与主题运行配置。
  同时被 partials/base-head.html（构建期内联）与 layout.html（运行时 th:replace）复用。
  注意：这里不能出现任何 @/assets 引用——本 fragment 自身也是构建 entry，
  带脚本引用会被注入 bundle，运行时再被 layout 替换进来就会重复加载。
-->
<th:block th:fragment="head-assets">
  <meta
    th:if="${(theme.config.style.color_scheme ?: 'system') != 'light'}"
    name="theme-color"
    media="(prefers-color-scheme: dark)"
    content="#161618"
  />
  <meta
    th:if="${(theme.config.style.color_scheme ?: 'system') != 'dark'}"
    name="theme-color"
    media="(prefers-color-scheme: light)"
    content="#fcfcfd"
  />

  <!-- 只有 Noto 两个字族走 jsDelivr；霞鹜文楷已随主题自托管，无需预连接 -->
  <link
    th:if="${(theme.config.style.font_family ?: 'system') == 'noto_sans_sc' or (theme.config.style.font_family ?: 'system') == 'noto_serif_sc'}"
    rel="preconnect"
    href="https://cdn.jsdelivr.net"
    crossorigin
  />
  <!-- Noto Sans SC：400 / 500 / 700 三档，按需加载 -->
  <link
    th:if="${(theme.config.style.font_family ?: 'system') == 'noto_sans_sc'}"
    rel="preload"
    href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.2.5/400.css"
    as="style"
    onload="
      this.onload = null;
      this.rel = 'stylesheet';
    "
    onerror="this.onload = null"
    crossorigin
  />
  <link
    th:if="${(theme.config.style.font_family ?: 'system') == 'noto_sans_sc'}"
    rel="preload"
    href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.2.5/500.css"
    as="style"
    onload="
      this.onload = null;
      this.rel = 'stylesheet';
    "
    onerror="this.onload = null"
    crossorigin
  />
  <link
    th:if="${(theme.config.style.font_family ?: 'system') == 'noto_sans_sc'}"
    rel="preload"
    href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.2.5/700.css"
    as="style"
    onload="
      this.onload = null;
      this.rel = 'stylesheet';
    "
    onerror="this.onload = null"
    crossorigin
  />
  <!-- Noto Serif SC：400 / 500 / 700 三档 -->
  <link
    th:if="${(theme.config.style.font_family ?: 'system') == 'noto_serif_sc'}"
    rel="preload"
    href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.9/400.css"
    as="style"
    onload="
      this.onload = null;
      this.rel = 'stylesheet';
    "
    onerror="this.onload = null"
    crossorigin
  />
  <link
    th:if="${(theme.config.style.font_family ?: 'system') == 'noto_serif_sc'}"
    rel="preload"
    href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.9/500.css"
    as="style"
    onload="
      this.onload = null;
      this.rel = 'stylesheet';
    "
    onerror="this.onload = null"
    crossorigin
  />
  <link
    th:if="${(theme.config.style.font_family ?: 'system') == 'noto_serif_sc'}"
    rel="preload"
    href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.9/700.css"
    as="style"
    onload="
      this.onload = null;
      this.rel = 'stylesheet';
    "
    onerror="this.onload = null"
    crossorigin
  />
  <!-- 霞鹜文楷（LXGW WenKai）：light / regular / bold，字模随主题自托管，按 unicode-range 分片 -->
  <link
    th:if="${(theme.config.style.font_family ?: 'system') == 'lxgw_wenkai'}"
    rel="preload"
    th:href="@{/assets/fonts/lxgwwenkai-light.css}"
    as="style"
    onload="
      this.onload = null;
      this.rel = 'stylesheet';
    "
    onerror="this.onload = null"
  />
  <link
    th:if="${(theme.config.style.font_family ?: 'system') == 'lxgw_wenkai'}"
    rel="preload"
    th:href="@{/assets/fonts/lxgwwenkai-regular.css}"
    as="style"
    onload="
      this.onload = null;
      this.rel = 'stylesheet';
    "
    onerror="this.onload = null"
  />
  <link
    th:if="${(theme.config.style.font_family ?: 'system') == 'lxgw_wenkai'}"
    rel="preload"
    th:href="@{/assets/fonts/lxgwwenkai-bold.css}"
    as="style"
    onload="
      this.onload = null;
      this.rel = 'stylesheet';
    "
    onerror="this.onload = null"
  />

  <script th:inline="javascript">
    window.i18nResources = {
      "jsModule.colorSchemeSwitcher.dark": `[(#{jsModule.colorSchemeSwitcher.dark})]`,
      "jsModule.colorSchemeSwitcher.light": `[(#{jsModule.colorSchemeSwitcher.light})]`,
      "jsModule.colorSchemeSwitcher.auto": `[(#{jsModule.colorSchemeSwitcher.auto})]`,
      "jsModule.share.qzone": `[(#{jsModule.share.qzone})]`,
      "jsModule.share.weibo": `[(#{jsModule.share.weibo})]`,
      "jsModule.share.douban": `[(#{jsModule.share.douban})]`,
      "jsModule.share.wechat": `[(#{jsModule.share.wechat})]`,
      "jsModule.share.native": `[(#{jsModule.share.native})]`,
      "jsModule.share.windowTitle": `[(#{jsModule.share.windowTitle})]`,
      "jsModule.upvote.networkError": `[(#{jsModule.upvote.networkError})]`,
    };
    var colorScheme = /*[[${theme.config.style.color_scheme}]]*/ "system";
    var enableChangeColorScheme = /*[[${theme.config.style.enable_change_color_scheme}]]*/ false;
    var defaultHue = /*[[${theme.config.style.accent_hue ?: 250}]]*/ 250;
    var enableChangeHue = /*[[${theme.config.style.enable_change_hue}]]*/ true;
    window.enableColorSchemeAnimation = /*[[${theme.config.style.enable_color_scheme_animation ?: false}]]*/ false;
    window.colorSchemeRevealDuration = /*[[${theme.config.style.color_scheme_reveal_duration ?: 700}]]*/ 700;
  </script>
  <script>
    // 必须在首次绘制前落地 --hue，否则换过色相的访客会看到一次默认色闪烁。
    (function () {
      var fallback = Number(defaultHue);
      var chosen = isFinite(fallback) ? fallback : 250;

      try {
        var raw = new URLSearchParams(window.location.search).get("hue");

        if ((raw === null || raw === "") && enableChangeHue) {
          raw = window.localStorage.getItem("theme-hue");
        }

        if (raw !== null && raw !== "" && isFinite(Number(raw))) {
          chosen = Number(raw);
        }
      } catch (error) {
        // 老浏览器或隐私模式下取不到存储时，退回主题配置的默认色相
      }

      document.documentElement.style.setProperty("--hue", String(((Math.round(chosen) % 360) + 360) % 360));
    })();
  </script>
  <noscript>
    <style>
      body {
        display: block !important;
      }
    </style>
  </noscript>
</th:block>
