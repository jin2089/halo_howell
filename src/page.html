<include src="layout.html">
  <template name="head">
    <title th:text="|${singlePage.spec.title} - ${site.title}|"></title>
    <script type="module" src="./assets/page.ts"></script>
  </template>
  <template name="hero">
    <section th:if="${theme.config.layout.content_header}" th:unless="${#strings.isEmpty(singlePage.spec.cover)}">
      <div class="relative flex items-center" th:styleappend="|height:${theme.config.post.cover_height ?: '24rem'}|">
        <div
          class="relative size-full bg-cover bg-center bg-no-repeat before:absolute before:inset-0 before:z-1 before:bg-black/40"
          th:style="|background-image: url('${singlePage.spec.cover}')|"
        ></div>
        <header
          class="pattern-header-text absolute top-1/3 mx-auto flex w-full flex-col items-center justify-center gap-3"
          th:if="${theme.config.post.title_position == 'cover'}"
        >
          <h1 class="text-center text-2xl text-white sm:text-5xl" th:text="${singlePage.spec.title}"></h1>
        </header>
      </div>
    </section>
  </template>
  <section
    class="mx-auto mt-6 grid max-w-7xl grid-cols-1 gap-6 px-4 lg:px-6"
    th:with="showSidebar=${theme.config.sidebar.show_on_page ?: false}"
    th:classappend="|${theme.config.layout.content_header and not #strings.isEmpty(singlePage.spec.cover) ? '!-mt-20' : ''} ${showSidebar ? 'md:grid-cols-[1fr_18rem]' : ''}|"
  >
    <div class="z-0 min-w-0" th:classappend="${showSidebar ? '' : 'mx-auto w-full max-w-4xl'}">
      <div class="bg-surface-card rounded-xl p-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h1
            th:if="${#strings.isEmpty(singlePage.spec.cover)} or ${theme.config.post.title_position == 'content'} or ${not theme.config.layout.content_header}"
            class="vt-post-title text-3xl font-bold break-all dark:text-slate-50"
            th:text="${singlePage.spec.title}"
          ></h1>
          <div
            sec:authorize="isAuthenticated()"
            th:attr="x-data=|uiPermission('${#authentication.name}','system:singlepages:manage')|"
            class="ml-auto flex items-center"
            id="edit-button"
          >
            <template x-if="shouldDisplay">
              <a
                th:href="|/console/single-pages/editor?name=${singlePage.metadata.name}&returnToView=true|"
                th:aria-label="#{common.edit}"
                th:title="#{common.edit}"
                class="inline-flex size-9 items-center justify-center rounded-full text-gray-500 transition-all hover:bg-gray-100 hover:text-gray-900 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-slate-100"
              >
                <span class="i-tabler-edit text-xl"></span>
              </a>
            </template>
          </div>
        </div>

        <div class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-gray-600 dark:text-slate-300">
          <a
            th:href="@{${singlePage.owner.permalink}}"
            th:title="${singlePage.owner.displayName}"
            class="inline-flex min-w-0 items-center gap-1.5 font-medium text-gray-800 transition-colors hover:text-gray-900 dark:text-slate-100 dark:hover:text-white"
          >
            <img
              th:if="${not #strings.isEmpty(singlePage.owner.avatar)}"
              th:src="${singlePage.owner.avatar}"
              class="size-6 rounded-full"
              th:alt="${singlePage.owner.displayName}"
            />
            <span class="truncate" th:text="${singlePage.owner.displayName}"></span>
          </a>
          <span
            class="inline-flex items-center gap-1"
            th:title="${#dates.format(singlePage.spec.publishTime,'yyyy-MM-dd')}"
          >
            <span class="i-tabler-calendar text-sm text-gray-400 dark:text-slate-500" aria-hidden="true"></span>
            <span th:text="#{common.publishedOn(${#dates.format(singlePage.spec.publishTime,'yyyy-MM-dd')})}"></span>
          </span>
          <span class="inline-flex items-center gap-1">
            <span class="i-tabler-eye text-sm text-gray-400 dark:text-slate-500" aria-hidden="true"></span>
            <span th:text="#{common.visitCount(${singlePage.stats?.visit ?:0})}"></span>
          </span>
          <a
            th:if="${haloCommentEnabled}"
            href="#comment"
            th:aria-label="#{common.comment}"
            th:title="#{common.comment}"
            class="hover:text-primary-500 dark:hover:text-primary-400 inline-flex items-center gap-1 transition-colors"
          >
            <span class="i-tabler-message-circle text-sm text-gray-400 dark:text-slate-500" aria-hidden="true"></span>
            <span th:text="${singlePage.stats?.comment ?: 0}"></span>
          </a>
        </div>

        <image-gallery
          data-gallery-content
          th:attr="data-dialog-label=#{fragment.gallery.title},data-close-label=#{fragment.lightbox.close},data-previous-label=#{fragment.gallery.previous},data-next-label=#{fragment.gallery.next},data-detail-label=#{fragment.gallery.detail}"
        >
          <article
            class="!max-w-none break-words"
            th:classappend="${theme.config.post.content_style == 'github' ? 'markdown-body' : 'tailwind-typography'}"
            th:utext="${singlePage.content.content}"
          ></article>
        </image-gallery>
        <hr th:if="${haloCommentEnabled}" class="my-10 dark:border-slate-700" />
        <div id="comment" th:if="${haloCommentEnabled}">
          <h2 class="mb-2 text-base font-medium text-gray-900 dark:text-slate-50" th:text="#{common.comment}"></h2>
          <halo:comment group="content.halo.run" kind="SinglePage" th:attr="name=${singlePage.metadata.name}" />
        </div>
      </div>
    </div>
    <th:block th:if="${showSidebar}">
      <th:block th:replace="~{modules/sidebar :: sidebar(prepend = null)}" />
    </th:block>
  </section>
</include>
