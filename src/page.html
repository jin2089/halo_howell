<include src="layout.html">
  <template name="head">
    <title th:text="|${singlePage.spec.title} - ${site.title}|"></title>
    <script type="module" src="./assets/page.ts"></script>
  </template>
  <section
    class="mx-auto mt-6 grid max-w-7xl grid-cols-1 gap-6 px-4 lg:px-6"
    th:with="showSidebar=${theme.config.sidebar.show_on_page ?: false}, titleOnCover = ${(theme.config.post.title_position ?: 'content') == 'cover' and not #strings.isEmpty(singlePage.spec.cover)}"
    th:classappend="${showSidebar ? 'md:grid-cols-[minmax(0,1fr)_18rem]' : ''}"
  >
    <div class="z-0 min-w-0" th:classappend="${showSidebar ? '' : 'mx-auto w-full max-w-4xl'}">
      <div class="post-detail animated fadeIn min-w-0 pt-2 lg:pt-8">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h1
            th:unless="${titleOnCover}"
            class="vt-post-title text-3xl font-bold break-all text-gray-900 dark:text-slate-50"
            th:text="${singlePage.spec.title}"
          ></h1>
          <div
            sec:authorize="isAuthenticated()"
            th:attr="x-data=|uiPermission('${#authentication.name}','system:singlepages:manage')|"
            class="ml-auto flex items-center"
            id="edit-button"
          >
            <template x-if="shouldDisplay">
              <a
                th:href="|/console/single-pages/editor?name=${singlePage.metadata.name}&returnToView=true|"
                th:aria-label="#{common.edit}"
                th:title="#{common.edit}"
                class="inline-flex size-9 items-center justify-center rounded-full text-gray-500 transition-all hover:bg-gray-100 hover:text-gray-900 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-slate-100"
              >
                <span class="i-tabler-edit text-xl"></span>
              </a>
            </template>
          </div>
        </div>

        <div
          class="my-4 flex flex-wrap items-center justify-between gap-4 text-sm text-gray-500 lg:my-8 dark:text-slate-400"
        >
          <div class="flex flex-wrap items-center gap-4">
            <span class="inline-flex items-center gap-1.5">
              <span class="i-tabler-eye text-sm" aria-hidden="true"></span>
              <span th:text="${singlePage.stats?.visit ?: 0}"></span>
            </span>
            <a
              th:if="${haloCommentEnabled}"
              href="#comment"
              th:aria-label="#{common.comment}"
              th:title="#{common.comment}"
              class="hover:text-primary-500 dark:hover:text-primary-400 inline-flex items-center gap-1.5 transition-colors"
            >
              <span class="i-tabler-message-circle text-sm" aria-hidden="true"></span>
              <span th:text="${singlePage.stats?.comment ?: 0}"></span>
            </a>
          </div>
          <span
            class="tabular-nums"
            th:title="${#dates.format(singlePage.spec.publishTime,'yyyy-MM-dd')}"
            th:text="${#dates.format(singlePage.spec.publishTime,'yyyy-MM-dd')}"
          ></span>
        </div>

        <div
          th:if="${not #strings.isEmpty(singlePage.spec.cover)}"
          class="post-feature-image relative mx-auto my-6 w-full overflow-hidden rounded-xl border border-gray-200/80 shadow-sm dark:border-slate-700"
          th:style="|--cover-height: ${theme.config.post.cover_height ?: '24rem'};|"
          th:classappend="${titleOnCover ? ' h-[var(--cover-height)]' : ''}"
        >
          <img
            class="w-full"
            th:classappend="${titleOnCover ? ' h-full object-cover' : ''}"
            th:src="${singlePage.spec.cover}"
            th:alt="${singlePage.spec.title}"
            th:srcset="|${thumbnail.gen(singlePage.spec.cover, 's')} 400w, ${thumbnail.gen(singlePage.spec.cover, 'm')} 800w, ${thumbnail.gen(singlePage.spec.cover, 'l')} 1200w, ${thumbnail.gen(singlePage.spec.cover, 'xl')} 1600w|"
            sizes="(max-width: 1600px) 100vw, 1600px"
            decoding="async"
          />
          <div
            th:if="${titleOnCover}"
            class="absolute inset-0 flex items-end bg-linear-to-t from-black/70 via-black/20 to-transparent p-5 sm:p-8"
          >
            <h1
              class="vt-post-title text-3xl font-bold break-all text-white drop-shadow sm:text-4xl"
              th:text="${singlePage.spec.title}"
            ></h1>
          </div>
        </div>

        <image-gallery
          data-gallery-content
          th:attr="data-dialog-label=#{fragment.gallery.title},data-close-label=#{fragment.lightbox.close},data-previous-label=#{fragment.gallery.previous},data-next-label=#{fragment.gallery.next},data-detail-label=#{fragment.gallery.detail}"
        >
          <article
            class="!max-w-none break-words"
            th:classappend="${theme.config.post.content_style == 'github' ? 'markdown-body' : 'tailwind-typography'}"
            th:utext="${singlePage.content.content}"
          ></article>
        </image-gallery>
        <hr th:if="${haloCommentEnabled}" class="my-10 dark:border-slate-700" />
        <div id="comment" th:if="${haloCommentEnabled}">
          <h2 class="mb-2 text-base font-medium text-gray-900 dark:text-slate-50" th:text="#{common.comment}"></h2>
          <halo:comment group="content.halo.run" kind="SinglePage" th:attr="name=${singlePage.metadata.name}" />
        </div>
      </div>
    </div>
    <th:block th:if="${showSidebar}">
      <th:block th:replace="~{modules/sidebar :: sidebar(prepend = null)}" />
    </th:block>
  </section>
</include>
