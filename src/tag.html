<include src="layout.html">
  <template name="head">
    <title th:text="|#{page.tag.title(${tag.spec.displayName})} - ${site.title}|"></title>
  </template>

  <section class="mx-auto mt-6 max-w-7xl px-4 lg:px-6">
    <div class="z-0 min-w-0">
      <div class="bg-surface-card rounded-xl p-4 shadow-sm transition-all duration-500 hover:shadow-md">
        <th:block th:replace="~{modules/tag-filter}" />
      </div>

      <div
        id="post-list"
        th:if="${posts.total gt 0}"
        th:with="postItems=${posts.items},list_layout=${(theme.config.layout.minimal_layout ?: true) ? 'single' : theme.config.layout.post_list_layout}"
        class="mt-6 grid grid-cols-1 gap-6"
        th:classappend="|${list_layout == 'grid_3' ? 'md:grid-cols-2 xl:grid-cols-3' : ''} ${list_layout == 'grid_2' ? 'md:grid-cols-2' : ''}|"
      >
        <th:block th:each="post, postStat : ${postItems}">
          <div
            class="animated fadeIn"
            th:style="|animation-delay:${postStat.index lt 12 ? postStat.index * 0.06 : 0}s|"
          >
            <th:block
              th:replace="~{modules/post-card :: post-card(${post},true,true,true,${list_layout == 'single' ? 'column' : 'row'})}"
            />
          </div>
        </th:block>
      </div>

      <th:block th:if="${posts.total == 0}">
        <th:block
          th:replace="~{modules/empty-state :: empty(message=#{common.noPosts}, icon='i-tabler-file-search')}"
        />
      </th:block>

      <th:block
        th:replace="~{modules/pagination :: pagination(context = |${tag.status.permalink}/|, prevUrl = ${posts.prevUrl}, nextUrl = ${posts.nextUrl}, totalPages = ${posts.totalPages}, page = ${posts.page}, hasPrevious = ${posts.hasPrevious()}, hasNext = ${posts.hasNext()})}"
      />
    </div>
  </section>
</include>
