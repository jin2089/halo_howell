<include src="layout.html">
  <template name="head">
    <title th:text="|${title ?: #messages.msg('page.photos.title')} - ${site.title}|"></title>
  </template>

  <section class="mx-auto mt-6 max-w-7xl px-4 lg:px-6">
    <div class="z-0 min-w-0">
      <div class="bg-surface-card rounded-xl p-4">
        <h1
          class="mb-9 text-2xl font-medium dark:text-slate-50"
          th:text="${title ?: #messages.msg('page.photos.title')}"
        ></h1>

        <th:block th:unless="${pluginFinder.available('PluginPhotos', '>=2.0.0')}">
          <div class="mb-8">
            <nav class="flex flex-wrap gap-4" aria-label="Tabs">
              <a
                th:href="@{/photos}"
                class="rounded-sm bg-gray-100 px-1 py-0.5 text-sm text-gray-900 hover:bg-gray-200 dark:bg-slate-600 dark:text-slate-50 dark:hover:bg-slate-700 dark:hover:text-slate-100"
                th:classappend="${#lists.isEmpty(param.group) ? '!bg-gray-200 dark:!bg-slate-700 dark:!text-slate-100 ring-2 ring-gray-300 dark:ring-slate-600' : ''}"
              >
                <span th:text="#{common.all}"></span>
              </a>
              <a
                th:each="group : ${photoFinder.groupBy()}"
                th:href="@{|/photos?group=${group.metadata.name}|}"
                class="rounded-sm bg-gray-100 px-1 py-0.5 text-sm text-gray-900 hover:bg-gray-200 dark:bg-slate-600 dark:text-slate-50 dark:hover:bg-slate-700 dark:hover:text-slate-100"
                th:classappend="${#lists.contains(param.group, group.metadata.name) ? '!bg-gray-200 dark:!bg-slate-700 dark:!text-slate-100 ring-2 ring-gray-300 dark:ring-slate-600' : ''}"
                th:text="${group.spec.displayName}"
              >
              </a>
            </nav>
          </div>

          <image-gallery
            id="photos"
            class="columns-1 gap-3 pb-12 sm:columns-2 sm:gap-3 md:columns-3 lg:columns-4 [&>article:not(:first-child)]:mt-3"
            th:attr="data-dialog-label=#{fragment.gallery.title},data-close-label=#{fragment.lightbox.close},data-previous-label=#{fragment.gallery.previous},data-next-label=#{fragment.gallery.next},data-detail-label=#{fragment.gallery.detail}"
          >
            <th:block th:each="photo : ${photos.items}">
              <th:block th:replace="~{modules/photo-gallery-item :: item(photo=${photo}, detailUrl='')}" />
            </th:block>
          </image-gallery>
        </th:block>

        <th:block th:if="${pluginFinder.available('PluginPhotos', '>=2.0.0')}">
          <div class="mb-8">
            <nav class="flex flex-wrap gap-4" aria-label="Tabs">
              <a
                th:href="@{${photoUrl.list()}}"
                class="rounded-sm bg-gray-100 px-1 py-0.5 text-sm text-gray-900 hover:bg-gray-200 dark:bg-slate-600 dark:text-slate-50 dark:hover:bg-slate-700 dark:hover:text-slate-100"
                th:classappend="${#lists.isEmpty(param.group) ? '!bg-gray-200 dark:!bg-slate-700 dark:!text-slate-100 ring-2 ring-gray-300 dark:ring-slate-600' : ''}"
              >
                <span th:text="#{common.all}"></span>
              </a>
              <a
                th:each="group : ${groups}"
                th:href="@{${photoUrl.list(group.metadata.name)}}"
                class="rounded-sm bg-gray-100 px-1 py-0.5 text-sm text-gray-900 hover:bg-gray-200 dark:bg-slate-600 dark:text-slate-50 dark:hover:bg-slate-700 dark:hover:text-slate-100"
                th:classappend="${#lists.contains(param.group, group.metadata.name) ? '!bg-gray-200 dark:!bg-slate-700 dark:!text-slate-100 ring-2 ring-gray-300 dark:ring-slate-600' : ''}"
                th:text="${group.spec.displayName}"
              >
              </a>
            </nav>
          </div>

          <image-gallery
            id="photos"
            class="columns-1 gap-3 pb-12 sm:columns-2 sm:gap-3 md:columns-3 lg:columns-4 [&>article:not(:first-child)]:mt-3"
            th:attr="data-dialog-label=#{fragment.gallery.title},data-close-label=#{fragment.lightbox.close},data-previous-label=#{fragment.gallery.previous},data-next-label=#{fragment.gallery.next},data-detail-label=#{fragment.gallery.detail}"
          >
            <th:block th:each="photo : ${photos.items}">
              <th:block
                th:replace="~{modules/photo-gallery-item :: item(photo=${photo}, detailUrl=${photoUrl.detail(photo)})}"
              />
            </th:block>
          </image-gallery>
        </th:block>

        <th:block th:if="${photos.total == 0}">
          <th:block
            th:replace="~{modules/empty-state :: empty(message=#{page.photos.empty}, icon='i-tabler-photo-off')}"
          />
        </th:block>

        <th:block
          th:replace="~{modules/pagination :: pagination(context = '/photos/', prevUrl = ${photos.prevUrl}, nextUrl = ${photos.nextUrl}, totalPages = ${photos.totalPages}, page = ${photos.page}, hasPrevious = ${photos.hasPrevious()}, hasNext = ${photos.hasNext()})}"
        />
      </div>
    </div>
  </section>
</include>
