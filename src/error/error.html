<include src="layout.html">
  <template name="head">
    <title
      th:text="${error.status} + ' | ' + ${#strings.defaultString(error.title, 'Internal server error')} + ' - ' +${site.title}"
    ></title>
  </template>

  <section class="mx-auto mt-6 max-w-7xl px-4 lg:px-6">
    <div class="z-0 min-w-0">
      <section class="flex items-center dark:bg-gray-900 dark:text-gray-100">
        <div class="container mx-auto my-8 flex flex-col items-center justify-center px-5">
          <div class="max-w-md text-center">
            <h2 class="mb-8 text-9xl font-extrabold dark:text-gray-600" th:text="${error.status}"></h2>
            <p
              class="mb-8 text-2xl font-semibold md:text-3xl"
              th:text="${#strings.defaultString(error.title, 'Internal server error')}"
            ></p>
            <p th:if="${not #strings.isEmpty(error.detail)}" class="mb-8 text-gray-500" th:text="${error.detail}"></p>
            <a
              th:href="@{${site.url}}"
              class="group bg-surface-elevated inline-flex items-center justify-center gap-1 rounded-md border border-gray-200 px-4 py-1 text-sm leading-6 font-medium whitespace-nowrap text-gray-600 shadow-xs hover:bg-gray-50 focus:shadow-none focus:outline-hidden dark:border-slate-600 dark:text-slate-100 dark:hover:bg-slate-600 dark:hover:text-white"
            >
              <span class="i-tabler-arrow-left text-lg transition-all group-hover:-translate-x-1"></span>
              <span th:text="#{page.error.backToHome}"></span>
            </a>
          </div>
        </div>
      </section>
    </div>
  </section>
</include>
