<header
  id="header-menu"
  class="bg-surface-card sticky top-0 z-10 flex h-16 py-3 shadow-xs transition-all"
  x-data="{ open : false }"
  th:classappend="${(theme.config.layout.enable_glass_navbar ?: false) ? ' header-menu-glass' : ''}"
  th:style="|--header-glass-opacity: ${theme.config.layout.glass_navbar_opacity ?: '0.82'}; --header-glass-blur-factor: ${theme.config.layout.glass_navbar_blur ?: '0.75'};|"
  th:with="menu = ${menuFinder.getPrimary()}, siteTitleSize = ${theme.config.layout.site_title_size ?: 'small'}"
>
  <div class="mx-auto flex h-full w-full max-w-7xl justify-between px-4 lg:px-6">
    <div class="flex h-full items-center gap-6">
      <div class="mr-2 h-full">
        <a href="/" class="inline-flex h-full items-center">
          <img
            th:if="${theme.config.global.logo_type == 'image'} and ${not #strings.isEmpty(site.logo)}"
            th:src="${site.logo}"
            th:alt="Logo"
            class="h-full w-auto"
          />
          <span
            th:if="${theme.config.global.logo_type == 'text'} or ${#strings.isEmpty(site.logo)}"
            id="site-title"
            class="font-medium text-gray-900 dark:text-slate-100"
            th:classappend="${siteTitleSize == 'large' ? ' text-2xl' : (siteTitleSize == 'medium' ? ' text-xl' : ' text-lg')}"
            th:text="${site.title}"
          ></span>
        </a>
      </div>
      <ul th:if="${menu != null} and ${not #lists.isEmpty(menu.menuItems)}" class="hidden items-center gap-8 sm:flex">
        <li
          th:each="menuItem : ${menu.menuItems}"
          class="relative cursor-pointer text-sm font-medium transition-all"
          x-data="dropdown"
          @mouseenter="open()"
          @mouseleave="close()"
        >
          <a
            class="hover:text-primary-600 text-gray-600 dark:text-slate-50 dark:hover:text-gray-300"
            th:href="@{${menuItem.status.href}}"
            th:text="${menuItem.status.displayName}"
            th:target="${menuItem.spec.target?.value}"
          ></a>
          <ul
            th:if="${not #lists.isEmpty(menuItem.children)}"
            @mouseenter="open()"
            @mouseleave="close()"
            x-show="show"
            x-cloak
            x-transition:enter="transition ease-out duration-100"
            x-transition:enter-start="transform opacity-0 scale-95"
            x-transition:enter-end="transform opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-75"
            x-transition:leave-start="transform opacity-100 scale-100"
            x-transition:leave-end="transform opacity-0 scale-95"
            class="menu-dropdown bg-surface-elevated absolute left-0 z-10 mt-2 w-40 divide-y divide-gray-50 overflow-hidden rounded-sm shadow-sm dark:divide-slate-600"
          >
            <li
              th:each="childMenuItem : ${menuItem.children}"
              class="flex w-full items-center text-left text-sm hover:bg-gray-50 dark:hover:bg-slate-600"
            >
              <a
                class="hover:text-primary-600 size-full truncate px-4 py-2 text-gray-600 dark:text-slate-50 dark:hover:text-gray-300"
                th:href="@{${childMenuItem.status.href}}"
                th:text="${childMenuItem.status.displayName}"
                th:target="${childMenuItem.spec.target?.value}"
              ></a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
    <div class="flex items-center">
      <ul x-data="colorSchemeSwitcher" class="flex items-center gap-4">
        <li class="sm:hidden" x-on:click="open = true">
          <div class="i-tabler-menu-2 hover:text-primary-600 text-lg text-gray-600 dark:text-slate-100"></div>
        </li>
        <li
          th:if="${theme.config.style.enable_change_color_scheme}"
          x-data="dropdown"
          class="relative cursor-pointer transition-all"
          @mouseenter="open()"
          @mouseleave="close()"
        >
          <div
            class="hover:text-primary-600 cursor-pointer text-lg text-gray-600 transition-all dark:text-slate-100"
            :class="colorScheme.icon"
          ></div>
          <ul
            @mouseenter="open()"
            @mouseleave="close()"
            x-show="show"
            x-cloak
            x-transition:enter="transition ease-out duration-100"
            x-transition:enter-start="transform opacity-0 scale-95"
            x-transition:enter-end="transform opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-75"
            x-transition:leave-start="transform opacity-100 scale-100"
            x-transition:leave-end="transform opacity-0 scale-95"
            class="bg-surface-elevated absolute right-0 z-10 mt-2 w-40 divide-y divide-gray-50 overflow-hidden rounded-sm shadow-sm dark:divide-slate-600"
          >
            <template x-for="colorScheme in colorSchemes">
              <li
                class="hover:text-primary-600 flex w-full items-center gap-2 px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 dark:text-slate-50 dark:hover:bg-slate-600 dark:hover:text-gray-300"
                @click="setColorScheme(colorScheme.value, true, $event)"
              >
                <span :class="colorScheme.icon"></span>
                <span x-text="colorScheme.label"></span>
              </li>
            </template>
          </ul>
        </li>
        <li
          th:if="${theme.config.style.enable_change_hue}"
          x-data="accentHueSwitcher"
          class="relative"
          @click.outside="open = false"
        >
          <div
            class="hover:text-primary-600 cursor-pointer text-lg text-gray-600 transition-all dark:text-slate-100"
            role="button"
            tabindex="0"
            th:title="#{fragment.header.accentHue}"
            @click="open = !open"
            @keydown.enter.prevent="open = !open"
          >
            <div class="i-tabler-palette"></div>
          </div>
          <div
            x-show="open"
            x-cloak
            x-transition:enter="transition ease-out duration-100"
            x-transition:enter-start="transform opacity-0 scale-95"
            x-transition:enter-end="transform opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-75"
            x-transition:leave-start="transform opacity-100 scale-100"
            x-transition:leave-end="transform opacity-0 scale-95"
            class="bg-surface-elevated absolute right-0 z-10 mt-2 w-48 rounded-sm p-3 shadow-sm"
          >
            <div
              class="mb-2 text-xs font-medium text-gray-500 dark:text-slate-300"
              th:text="#{fragment.header.accentHue}"
            ></div>
            <div class="flex items-center gap-2.5">
              <template x-for="preset in presets" :key="preset.hue">
                <button
                  type="button"
                  class="size-6 rounded-full border border-gray-200 transition-transform hover:scale-110 dark:border-slate-600"
                  x-bind:style="preset.swatch"
                  x-bind:class="
                    activeHue === preset.hue
                      ? 'ring-2 ring-primary-500 ring-offset-2 ring-offset-white dark:ring-offset-slate-700'
                      : ''
                  "
                  x-bind:title="preset.label"
                  x-bind:aria-label="preset.label"
                  @click="selectHue(preset.hue)"
                ></button>
              </template>
            </div>
          </div>
        </li>
        <!-- https://github.com/halo-sigs/plugin-search-widget -->
        <li th:if="${pluginFinder.available('PluginSearchWidget')}">
          <a
            href="javascript:SearchWidget.open()"
            th:title="#{fragment.header.search}"
            class="hover:text-primary-600 text-gray-600 dark:text-slate-100"
          >
            <div class="i-tabler-search text-lg"></div>
          </a>
        </li>
        <li
          x-data="dropdown"
          class="relative cursor-pointer transition-all"
          th:with="currentUser = ${contributorFinder.getContributor(#authentication.name)}"
          @mouseenter="open()"
          @mouseleave="close()"
        >
          <div>
            <div class="hover:text-primary-600 size-5 text-gray-600 dark:text-slate-100">
              <img
                class="size-5 rounded-full"
                th:src="${currentUser.avatar ?: #theme.assets('/images/default-avatar.svg')}"
                th:alt="${currentUser.displayName}"
              />
            </div>
            <ul
              @mouseenter="open()"
              @mouseleave="close()"
              x-show="show"
              x-cloak
              x-transition:enter="transition ease-out duration-100"
              x-transition:enter-start="transform opacity-0 scale-95"
              x-transition:enter-end="transform opacity-100 scale-100"
              x-transition:leave="transition ease-in duration-75"
              x-transition:leave-start="transform opacity-100 scale-100"
              x-transition:leave-end="transform opacity-0 scale-95"
              class="bg-surface-elevated absolute right-0 z-10 mt-2 w-40 divide-y divide-gray-50 overflow-hidden rounded-sm shadow-sm dark:divide-slate-600"
            >
              <li
                sec:authorize="isAuthenticated()"
                class="flex w-full items-center text-left text-sm hover:bg-gray-50 dark:hover:bg-slate-600"
              >
                <a
                  class="hover:text-primary-600 size-full truncate px-4 py-2 text-gray-600 dark:text-slate-50 dark:hover:text-gray-300"
                  href="/console"
                  target="_blank"
                  th:text="#{fragment.header.console}"
                >
                </a>
              </li>
              <li
                sec:authorize="isAuthenticated()"
                class="flex w-full items-center text-left text-sm hover:bg-gray-50 dark:hover:bg-slate-600"
              >
                <a
                  class="hover:text-primary-600 size-full truncate px-4 py-2 text-gray-600 dark:text-slate-50 dark:hover:text-gray-300"
                  href="/logout"
                  th:text="#{fragment.header.logout}"
                >
                </a>
              </li>
              <li
                sec:authorize="isAnonymous()"
                class="flex w-full items-center text-left text-sm hover:bg-gray-50 dark:hover:bg-slate-600"
              >
                <a
                  class="hover:text-primary-600 size-full truncate px-4 py-2 text-gray-600 dark:text-slate-50 dark:hover:text-gray-300"
                  href="/login"
                  onclick="this.href = '/login?redirect_uri=' + encodeURIComponent(window.location.href)"
                  th:text="#{fragment.header.login}"
                >
                </a>
              </li>
            </ul>
          </div>
        </li>
      </ul>
    </div>
  </div>
  <div th:if="${menu != null} and ${not #lists.isEmpty(menu.menuItems)}">
    <div
      class="fixed inset-0 z-50 bg-gray-800/40 opacity-100 backdrop-blur-xs dark:bg-black/80"
      aria-hidden="true"
      x-show="open"
      x-cloak
      x-transition:enter="ease-in-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="ease-in-out duration-300"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
    ></div>
    <div
      class="bg-surface-card fixed inset-x-4 top-8 z-50 origin-top scale-100 rounded-lg p-4"
      tabindex="-1"
      x-show="open"
      x-cloak
      x-transition:enter="ease-out duration-200"
      x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
      x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave="ease-in duration-100"
      x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
      @click.outside="open = false"
    >
      <div class="flex flex-row-reverse items-center justify-between">
        <button
          class="i-tabler-x p-1 text-xl text-gray-600 dark:text-slate-300"
          type="button"
          tabindex="0"
          @click="open = false"
        ></button>
        <h2 class="text-sm font-medium text-gray-600 dark:text-slate-300" th:text="#{fragment.header.menu}"></h2>
      </div>
      <nav class="mt-6">
        <ul class="-my-2 divide-y divide-gray-100 text-sm text-gray-800 dark:divide-slate-800 dark:text-slate-100">
          <li th:each="menuItem : ${menu.menuItems}">
            <a
              class="flex items-center justify-between gap-1 py-2"
              th:href="@{${menuItem.status.href}}"
              th:target="${menuItem.spec.target?.value}"
            >
              <span th:text="${menuItem.status.displayName}"></span>
            </a>
            <ul class="divide-y divide-gray-100 dark:divide-slate-800" th:if="${not #lists.isEmpty(menuItem.children)}">
              <li th:each="childMenuItem : ${menuItem.children}" class="flex w-full items-center text-left text-sm">
                <a
                  class="size-full truncate px-4 py-2 text-gray-600 dark:text-slate-200"
                  th:href="@{${childMenuItem.status.href}}"
                  th:text="${childMenuItem.status.displayName}"
                  th:target="${childMenuItem.spec.target?.value}"
                ></a>
              </li>
            </ul>
          </li>
        </ul>
      </nav>
      <div th:if="${theme.config.style.enable_change_hue}" x-data="accentHueSwitcher" class="mt-6">
        <h2 class="text-sm font-medium text-gray-600 dark:text-slate-300" th:text="#{fragment.header.accentHue}"></h2>
        <div class="mt-3 flex items-center gap-3">
          <template x-for="preset in presets" :key="preset.hue">
            <button
              type="button"
              class="size-7 rounded-full border border-gray-200 transition-transform hover:scale-110 dark:border-slate-600"
              x-bind:style="preset.swatch"
              x-bind:class="
                activeHue === preset.hue
                  ? 'ring-2 ring-primary-500 ring-offset-2 ring-offset-white dark:ring-offset-slate-900'
                  : ''
              "
              x-bind:aria-label="preset.label"
              @click="selectHue(preset.hue)"
            ></button>
          </template>
        </div>
      </div>
    </div>
  </div>
</header>
