<!doctype html>
<html
  th:lang="${#locale.toLanguageTag}"
  th:with="stylePreset = ${'theme-preset-' + (theme.config.style.style_preset ?: 'plain')}"
  th:classappend="${stylePreset}"
>
  <head>
    <include src="base-head.html" />

    <slot name="head" />
  </head>
  <body
    class="hidden bg-slate-50 dark:bg-slate-900"
    th:with="fontClass = ${theme.config.style.font_family == 'noto_sans_sc' ? 'font-noto-sans-sc' : (theme.config.style.font_family == 'noto_serif_sc' ? 'font-noto-serif-sc' : (theme.config.style.font_family == 'lxgw_wenkai' ? 'font-lxgw-wenkai' : ''))}"
    th:classappend="${fontClass}"
  >
    <a href="#pjax-container" class="skip-to-content" th:text="#{fragment.layout.skipToContent}">跳到正文</a>

    <reading-progress
      th:if="${theme.config.layout.show_reading_progress != false}"
      class="reading-progress-bar"
      aria-hidden="true"
    >
      <div class="reading-progress-fill"></div>
    </reading-progress>

    <include src="header.html" />

    <main id="pjax-container" tabindex="-1" class="outline-hidden">
      <slot name="hero" />

      <slot />
    </main>

    <!-- Pjax 换页后的标题播报：屏幕阅读器用户无法从视觉上感知内容已替换 -->
    <div id="pjax-announcer" aria-live="polite" aria-atomic="true" class="sr-only"></div>

    <include src="footer.html" />

    <back-to-top
      th:if="${theme.config.global.show_scroll_button}"
      th:aria-label="#{fragment.layout.toTop}"
      class="fixed right-5 bottom-5 flex items-center justify-center rounded-full bg-white p-3 shadow-sm transition-all duration-300 hover:shadow-lg lg:right-10 lg:bottom-10 dark:bg-slate-600"
    >
      <span class="i-tabler-chevron-up text-2xl text-gray-600 dark:text-slate-200"></span>
    </back-to-top>
  </body>
</html>
