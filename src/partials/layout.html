<!doctype html>
<html th:lang="${#locale.toLanguageTag}">
  <head>
    <include src="base-head.html" />

    <slot name="head" />
  </head>
  <body class="hidden bg-slate-50 dark:bg-slate-900">
    <include src="header.html" />

    <main id="pjax-container" tabindex="-1" class="outline-none">
      <slot name="hero" />

      <slot />
    </main>

    <!-- Pjax 换页后的标题播报：屏幕阅读器用户无法从视觉上感知内容已替换 -->
    <div id="pjax-announcer" aria-live="polite" aria-atomic="true" class="sr-only"></div>

    <include src="footer.html" />

    <back-to-top
      th:if="${theme.config.global.show_scroll_button}"
      th:aria-label="#{fragment.layout.toTop}"
      class="fixed bottom-5 right-5 flex items-center justify-center rounded-full bg-white p-3 shadow transition-all duration-300 hover:shadow-lg dark:bg-slate-600 lg:bottom-10 lg:right-10"
    >
      <span class="i-tabler-chevron-up text-2xl text-gray-600 dark:text-slate-200"></span>
    </back-to-top>
  </body>
</html>
