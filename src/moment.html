<include src="layout.html">
  <template name="head">
    <title th:text="|${title ?: #messages.msg('page.moments.title')} - ${site.title}|"></title>
    <script type="module" src="./assets/moment.ts"></script>
  </template>
  <section class="mx-auto mt-6 max-w-7xl px-4 lg:px-6">
    <div class="z-0 min-w-0">
      <div class="bg-surface-card rounded-xl p-4">
        <div
          th:with="content=${moment.spec.content}"
          x-data="upvote('moment','moment.halo.run','moment')"
          class="animated fadeIn"
        >
          <div
            class="flex w-full items-start gap-2 py-5"
            th:attr="x-data=|{name:'${moment.metadata.name}',showComment:true}|"
          >
            <img
              th:src="${moment.owner.avatar ?: #theme.assets('/images/default-avatar.svg')}"
              th:title="${moment.owner.displayName}"
              th:alt="${moment.owner.displayName}"
              class="size-12 rounded-full"
            />
            <div class="ml-6" style="width: calc(100% - 4.75rem)">
              <div class="mb-2 flex items-center gap-2">
                <span
                  class="text-sm font-medium text-gray-900 dark:text-slate-50"
                  th:text="${moment.owner.displayName}"
                ></span>
                <span
                  class="text-xs text-gray-400 dark:text-slate-400"
                  th:text="${#dates.format(moment.spec.releaseTime,'yyyy-MM-dd HH:mm')}"
                ></span>
              </div>
              <div
                th:utext="${content.html}"
                class="moment-content prose prose-base dark:prose-invert prose-pre:p-0 !max-w-none break-words"
              ></div>
              <div
                th:unless="${#lists.isEmpty(moment.spec.content.medium)}"
                class="moment-media mt-4 grid w-full grid-cols-3 gap-2 sm:w-1/2"
              >
                <div class="aspect-square" th:each="media : ${moment.spec.content.medium}">
                  <img
                    th:if="${#strings.equals(media.type,'PHOTO')}"
                    class="transform-gpu rounded-lg object-cover"
                    th:src="${media.url}"
                    th:srcset="|${thumbnail.gen(media.url, 's')} 400w,
                                ${thumbnail.gen(media.url, 'm')} 800w,
                                ${thumbnail.gen(media.url, 'l')} 1200w|"
                    sizes="(max-width: 1200px) 100vw, 1200px"
                  />
                  <video-lightbox
                    th:if="${#strings.equals(media.type,'VIDEO')}"
                    th:attr="src=${media.url},data-close-label=#{fragment.lightbox.close}"
                    role="button"
                    tabindex="0"
                    class="block aspect-square cursor-pointer"
                  >
                    <video th:src="${media.url}" class="rounded-lg object-cover"></video>
                    <div
                      class="absolute flex size-full items-center justify-center rounded-lg bg-gray-50 opacity-50 transition-all hover:opacity-70"
                    >
                      <i class="i-tabler-play !size-7"></i>
                    </div>
                  </video-lightbox>
                </div>
              </div>
              <div class="mt-3 flex items-center gap-4">
                <div
                  class="hover:text-danger-700 dark:hover:text-danger-700 inline-flex cursor-pointer items-center text-sm text-gray-400 transition-all dark:text-slate-400"
                  x-bind:class="{'!text-danger-700': upvoted(name)}"
                  @click="handleUpvote(name)"
                >
                  <i x-show="upvoted(name)" x-cloak class="i-tabler-heart-filled size-3"></i>
                  <i x-show="!upvoted(name)" x-cloak class="i-tabler-heart size-3"></i>
                  <span
                    class="ml-1"
                    th:attr="data-upvote-moment-name=${moment.metadata.name}"
                    th:text="${moment.stats.upvote}"
                  >
                  </span>
                </div>
                <div
                  class="inline-flex cursor-pointer items-center text-sm text-gray-400 transition-all hover:text-black dark:text-slate-400 dark:hover:text-slate-300"
                  :class="{'!text-black dark:!text-slate-300':showComment}"
                  x-on:click="showComment = !showComment"
                >
                  <i class="i-tabler-message-circle size-3"></i>
                  <span class="ml-1" th:text="${moment.stats.approvedComment}"> </span>
                </div>
                <div
                  th:if="${not #lists.isEmpty(moment.spec.tags)}"
                  class="inline-flex items-center gap-1 text-sm text-gray-400 dark:text-slate-400"
                >
                  <i class="i-tabler-tag size-3"></i>
                  <a
                    th:each="tag,iterStat : ${moment.spec.tags}"
                    th:href="@{/moments(tag=${tag})}"
                    class="hover:text-primary-600 dark:hover:text-primary-400 ml-1"
                    th:text="|#${tag}${!iterStat.last ? ' ' : ''}|"
                  ></a>
                </div>
              </div>

              <div class="mt-2" x-show="showComment" x-cloak>
                <halo:comment group="moment.halo.run" kind="Moment" th:attr="name=${moment.metadata.name}" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</include>
